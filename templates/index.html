<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hiboo Tools</title>
  <style>
    /* Basic resets and body styling */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background-color: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    /* Orange button styling */
    button {
      background-color: #FFA500; /* Orange color */
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #cc8400; /* darker orange on hover */
    }

    /* Dropdown container */
    .dropdown {
      position: relative;
      display: inline-block;
      margin-right: 15px; /* spacing between dropdowns */
    }
    .dropbtn {
      /* same style as button above, but you could vary if you want */
      background-color: #FFA500;
      color: #fff;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .dropbtn:hover {
      background-color: #cc8400;
    }

    /* Dropdown content (hidden by default) */
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #fff;
      min-width: 160px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 999;
    }
    /* Links inside dropdown */
    .dropdown-content a {
      color: #333;
      padding: 10px 12px;
      text-decoration: none;
      display: block;
      font-size: 14px;
    }
    .dropdown-content a:hover {
      background-color: #f2f2f2;
    }
    /* Show the dropdown on hover */
    .dropdown:hover .dropdown-content {
      display: block;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    form label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
    }
    form input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .form-group { margin-bottom: 15px; }
    .form-actions { margin-top: 20px; }

    /* Table styling */
    table.firewall-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .firewall-table th, .firewall-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    .firewall-table th { background-color: #f2f2f2; }
  </style>
</head>
<body>

<div class="container">
  <h1>Hiboo Tools</h1>

  <div class="card" id="topologyCard">
    <div class="dropdown">
      <button class="dropbtn">TShoot Tools</button>
      <div class="dropdown-content">
        <a href="#" onclick="loadTopology();return false;">Generate Topology</a>
        <a href="#">Customer Shoot</a>
      </div>
    </div>

    <div class="dropdown">
      <button class="dropbtn">Config Tools</button>
      <div class="dropdown-content">
        <a href="#">Config New Customer</a>
        <a href="#">Check Current Customer Config</a>
        <!-- NEW item for backups: points to /backup_configs route -->
        <a href="/backup_configs">Backup Device Config</a>
      </div>
    </div>

    <div class="dropdown">
      <button class="dropbtn">Firewall Tools</button>
      <div class="dropdown-content">
        <a href="#">New Rule</a>
        <a href="#firewallCard">Check Firewall Rule</a>
      </div>
    </div>

    <iframe id="topologyFrame" src=""></iframe>
  </div>

  <!-- Second card: Firewall Rule Checker form -->
  <div class="card" id="firewallCard">
    <h2>Firewall Rule Checker</h2>
    <form id="fwCheckForm" method="POST" action="/check_firewall">
      <div class="form-group">
        <label>Source IP:</label>
        <input type="text" name="src_ip" required
               placeholder="Type either an IP (10.10.10.10) or an address name (aws)" />
      </div>
      <div class="form-group">
        <label>Destination IP:</label>
        <input type="text" name="dst_ip" required
               placeholder="Type either an IP (10.10.10.10) or an address name (aws)" />
      </div>
      <div class="form-group">
        <label>Destination Port:</label>
        <input type="text" name="dst_port" required
               placeholder="e.g. 22 or ssh"
               pattern="^(\d{1,5}|[a-zA-Z][a-zA-Z0-9-_]+)$"
               title="Enter a numeric port (like 22) or a protocol name (like ssh)." />
      </div>
      <div class="form-actions">
        <button type="submit">Check Firewall Rules</button>
      </div>
    </form>

    <!-- The AJAX results go here -->
    <div id="fwResult" style="margin-top: 20px;"></div>
  </div>
</div>

<script>
function loadTopology() {
  document.getElementById("topologyFrame").src = "/generate_topology";
}

// If you have "toggleMore()" or "toggleLines()" for expansions, define them here
function toggleMore() {
  let div = document.getElementById("moreDetails");
  if (!div) return;
  div.style.display = (div.style.display === "none") ? "block" : "none";
}

function toggleLines() {
  let div = document.getElementById("lineDetails");
  if (!div) return;
  div.style.display = (div.style.display === "none") ? "block" : "none";
}

// Intercept the form submission, do an AJAX fetch, then show the results in #fwResult
const fwCheckForm = document.getElementById('fwCheckForm');
fwCheckForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(fwCheckForm);

  try {
    const response = await fetch('/check_firewall', {
      method: 'POST',
      body: formData
    });
    const html = await response.text();
    document.getElementById('fwResult').innerHTML = html;
  } catch (err) {
    document.getElementById('fwResult').innerHTML =
      '<p style="color:red;">Error checking firewall rules.</p>';
    console.error(err);
  }
});
</script>

</body>
</html>
